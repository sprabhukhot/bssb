# Netlify deploy for Next.js App Router (standalone BSSB Events app).
# Main site bssb.cz stays on its existing Netlify site; link/redirect later.

[build]
  command = "npm run build"
  # Next.js on Netlify is handled by the OpenNext-based plugin; publish is managed by it.
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # Keep scanning on. Omit generated cache (and this server-only key) so a
  # request-time env value inlined into Turbopack cache does not fail deploy.
  SECRETS_SCAN_ENABLED = "true"
  SECRETS_SCAN_OMIT_PATHS = ".netlify"
  SECRETS_SCAN_OMIT_KEYS = "RESEND_API_KEY"

[[plugins]]
  package = "@netlify/plugin-nextjs"
